<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0aa2d6" />
  <meta name="description" content="FlashCard — app de estudio con repetición espaciada para PC y Android." />
  <title>FlashCard · Estudio</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Barra superior -->
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Volver">‹</button>
      <h1 id="topTitle" class="topbar-title">FlashCard</h1>
      <button id="themeBtn" class="icon-btn" aria-label="Cambiar tema" title="Tema claro/oscuro">◐</button>
    </header>

    <!-- Contenido dinámico -->
    <main id="view" class="view"></main>

    <!-- Aviso de instalación PWA -->
    <div id="installBar" class="install-bar hidden">
      <span>Instala FlashCard en tu dispositivo</span>
      <button id="installBtn" class="btn btn-small">Instalar</button>
      <button id="installClose" class="icon-btn" aria-label="Cerrar">×</button>
    </div>
  </div>

  <!-- Datos: mazos integrados (se cargan antes que la app). Añade aquí más materias. -->
  <script src="js/app.js"></script>
  <script src="data/vision-artificial.js"></script>
  <script>
    // Arranque: procesa la cola de materias registradas y monta la app.
    window.addEventListener('DOMContentLoaded', function () {
      FlashCard.boot();
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    });
  </script>
</body>
</html>
